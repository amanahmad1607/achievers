<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--navy:#12315a;--navy2:#0b1f3a;--gold:#f2b705;--bg:#f3f6fb;--card:#fff;--text:#1b2a41;--mute:#64748b;--line:#e2e8f0;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--free:#e0e7ff;--freet:#3730a3}

:root[data-theme="dark"]{--bg:#0b1424;--card:#13233d;--text:#e6edf7;--mute:#93a4bd;--line:#26385a;--okbg:#14532d;--ok:#bbf7d0;--badbg:#7f1d1d;--bad:#fecaca;--free:#26385a;--freet:#c7d2fe;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;cursor:pointer;font-weight:600}

.ct{display:flex;gap:20px;flex-wrap:wrap}.ct .ci{flex:1;min-width:230px}.ct .ci p{margin:8px 0}.ct .ci a{color:inherit}.soc{display:flex;gap:10px;margin-top:16px}.soc a{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none}.mp{flex:1.3;min-width:260px}.mp svg{width:100%;height:auto;border-radius:12px;display:block}.mp .btn{display:inline-block;text-decoration:none;margin:10px 8px 0 0}
.sb.occ{background:var(--okbg);color:var(--ok)}.sb.me{background:var(--gold);color:#1b1400;box-shadow:0 0 0 3px var(--text);font-weight:800}
.lscroll{overflow-x:auto}.lay{display:block;width:100%;min-width:640px;height:auto}
.sk rect{stroke:transparent}.sk text{font:700 13px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}.sk text.yo{font-size:8px}

.sk.bad rect{fill:var(--badbg)}.sk.bad text{fill:var(--bad)}
.sk.me rect{fill:var(--gold);stroke:var(--text);stroke-width:3}.sk.me text{fill:#1b1400}
.lay .lbl{fill:var(--mute);font:600 12px system-ui,sans-serif;text-anchor:middle}
.foot{text-align:center;color:var(--mute);font-size:13px;margin:30px 0 10px}

<script>
const TOTAL=115,ADMIN={email:'admin@achievers.in',pass:'admin123'};
const JOBS=['UPSC','SSC','Banking','Railways','State PSC','Defence','Teaching (CTET/TET)','NEET','JEE','GATE','Other'];
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]??d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let mgr=store.get('asp_mgr',{name:'Manager Name',role:'Manager, Achievers Study Point',msg:'Dear students,\nSuccess comes from discipline and consistent hard work. Our aim is to give you a peaceful place to study so that you can focus on your goals. Make full use of every hour, and we are always here to support you.\nBest wishes for your preparation!',photo:''});
let students=store.get('asp_students',[]),session=null,tab='login',view='home',wl=store.get('asp_wl',[]),ann=store.get('asp_ann','');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>store.set('asp_students',students);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SH={M:'Morning',E:'Evening',F:'Full Day'};let pendingCI=false;
function nextSeat(sh='F'){for(let i=1;i<=TOTAL;i++){const on=students.filter(s=>s.seat===i);if(!on.length||(sh!=='F'&&on.every(s=>(s.shift||'F')!=='F'&&(s.shift||'F')!==sh)))return i}return null}
function addMonth(ds){const [y,m,d]=ds.split('-').map(Number),dt=new Date(Date.UTC(y,m,1));dt.setUTCDate(Math.min(d,new Date(Date.UTC(y,m+1,0)).getUTCDate()));return dt.toISOString().slice(0,10)}
const untilOf=h=>addMonth(h.m+'-01');
const dueOf=s=>addMonth(today().slice(0,7)+'-01');
function monthsFrom(s){const out=[];let [y,m]=(s.joined||today()).slice(0,7).split('-').map(Number);const [cy,cm]=today().slice(0,7).split('-').map(Number);while(y<cy||(y===cy&&m<=cm)){out.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++}}return out}
const unpaidMonths=s=>monthsFrom(s).filter(k=>!(s.hist||[]).some(h=>h.m===k));
const owed=s=>unpaidMonths(s).length;
const feeState=s=>{const n=owed(s);return n>1||(n===1&&s.fee)?n+' month'+(n>1?'s':'')+' pending':s.fee?'Paid':(new Date().getDate()>5?'Overdue':'Pending')};
const norm=s=>{const c=today().slice(0,7);if(!s.hist)s.hist=s.fee?[{m:c,d:s.joined}]:[];s.fee=s.hist.some(h=>h.m===c);if(!s.shift)s.shift='F'};
const seatsUsed=()=>new Set(students.map(s=>s.seat)).size;
const waLink=s=>{let p=s.phone.replace(/\D/g,'');if(p.length===10)p='91'+p;return 'https://wa.me/'+p+'?text='+encodeURIComponent('Hello '+s.name+', your monthly fee for Achievers Study Point (Seat '+s.seat+') is pending. Please pay at the desk. Thank you!')};
const Q=['Discipline is the bridge between goals and achievement.','Small daily efforts create big results.','Today’s hard work is tomorrow’s success.','Consistency beats intensity.','Your only competition is who you were yesterday.','Dreams need seats, and you have one. Use it well.','Don’t watch the clock; do what it does, keep going.'];
const fmt=m=>Math.floor(m/60)+'h '+Math.round(m%60)+'m';
const live=s=>s.ci?(Date.now()-s.ci)/60000:0;
const dayMin=(s,d)=>(s.log&&s.log[d]||0)+(d===today()?live(s):0);
const monthMin=s=>{const p=today().slice(0,7);return Object.keys(s.log||{}).filter(k=>k.startsWith(p)).reduce((a,k)=>a+s.log[k],0)+live(s)};
function streak(s){const has=d=>dayMin(s,d)>0;let n=0,d=new Date();if(!has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
const noticeHtml=()=>ann?`<div class="card" style="margin-top:16px;border-left:5px solid var(--gold)"><b>📢 Notice Board</b><ul style="margin:8px 0 0;padding-left:20px">${ann.split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
function extras(s){const top=students.map(x=>[x.name.split(' ')[0],monthMin(x),x.id]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `${s.must?'<div class="card" style="margin-top:14px;border-left:5px solid var(--gold)">🔑 <b>Your password was reset by the admin.</b> Please change it below to a password only you know.</div>':''}${!owed(s)?'':'<div class="card" style="margin-top:14px;border-left:5px solid var(--bad)">💰 <b>Fee reminder:</b> your fee is pending: '+feeState(s)+'. Please pay at the desk.</div>'}${noticeHtml()}
<div class="card" style="margin-top:14px"><h3 style="margin-top:0">⏱ Study Tracker</h3><div class="stats"><div class="stat"><small>Today</small><b>${fmt(dayMin(s,today()))}</b></div><div class="stat"><small>This month</small><b>${fmt(monthMin(s))}</b></div><div class="stat"><small>Study streak</small><b>🔥 ${streak(s)} days</b></div></div><button class="btn" id="ci">${s.ci?'Check Out':'Check In'}</button></div>
<div class="card" style="margin-top:14px"><h3 style="margin-top:0">🏆 Top Achievers This Month</h3>${top.length?top.map((x,i)=>`<div>${['🥇','🥈','🥉','4.','5.'][i]} ${esc(x[0])}${x[2]===s.id?' (you)':''} - ${fmt(x[1])}</div>`).join(''):'Check in to appear here!'}</div>
<div class="card" style="margin-top:14px"><h3 style="margin-top:0">🧾 Fee History</h3>${(s.hist||[]).length?s.hist.slice().reverse().map((h,i)=>`<div style="padding:3px 0">${h.d} - paid for ${h.m} <button class="pill ok" data-rc="${s.hist.length-1-i}">Receipt</button></div>`).join(''):'No payments recorded yet.'}</div>
${idBox()}${fbBox(s)}${pwCard()}${myMap(s)}
<div class="card" style="margin-top:14px;text-align:center"><i>“${Q[new Date().getDate()%Q.length]}”</i></div>`}
function myMap(s){return `<div class="card" style="margin-top:14px"><h3 style="margin-top:0">🪑 Seat Map</h3>${layoutSVG(i=>{const on=students.some(x=>x.seat===i),me=i===s.seat;return{c:me?'me':on?'occ':'free',me,t:me?'Your seat':on?'Occupied':'Free'}})}<div class="hint"><b>Gold</b> = your seat (${s.seat}), green = occupied, indigo = free. Layout follows the hall: door below seats 38 and 37.</div></div>`}
function bindExtras(s){$('#ci').onclick=()=>{if(s.ci){s.log=s.log||{};s.log[today()]=(s.log[today()]||0)+live(s);s.ci=0}else{s.ci=Date.now();s.pd=today()}save();studentView()};bindMore(s);if(pendingCI&&!s.ci){pendingCI=false;$('#ci').click()}}
function render(){students.forEach(norm);$('#gf').classList.toggle('hide',!session);
 $('#out').classList.toggle('hide',!session);$('#who').textContent=session?(session.role==='admin'?(session.super?'Super Admin':(/^admin$/i.test(session.name)?'Admin':'Admin: '+session.name)):session.name):'';
 $('#hm').classList.toggle('hide',!!session||view==='home');
 if(!session)return view==='home'?homeView():authView();session.role==='admin'?adminView():studentView();
}
let ct=store.get('asp_ct',{addr:'Achievers Study Point, Lucknow (add full address)',phone:'+91 00000 00000',email:'info@achievers.in',ig:'https://instagram.com/',fb:'https://facebook.com/',yt:'https://youtube.com/',wa:'https://wa.me/',tg:'https://t.me/'});
const SOC={ig:['Instagram','#e1306c','<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>'],fb:['Facebook','#1877f2','<path d="M14 8h3V4h-3a4 4 0 00-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8z" fill="currentColor"/>'],yt:['YouTube','#ff0000','<rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>'],wa:['WhatsApp','#25d366','<path d="M3 21l1.6-4.6A8.5 8.5 0 1112 20.500a8.400 8.400 0 01-4-1L3 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8c0 3 3 6 6 6l1-2-2-1-1 .8c-.8-.4-1.600-1.200-2-2L11.800 9l-1-2z" fill="currentColor"/>'],tg:['Telegram','#229ed9','<path d="M21 4L3 11l6 2 2 6 3-4 5 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>']};
const mapUrl=()=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ct.addr);
function contactHtml(){
 return `<div class="card ct"><div class="ci"><p>📍 ${esc(ct.addr)}</p><p>📞 <a href="tel:${esc(ct.phone.replace(/\s/g,''))}">${esc(ct.phone)}</a></p><p>✉️ <a href="mailto:${esc(ct.email)}">${esc(ct.email)}</a></p>
 <div class="soc">${Object.keys(SOC).filter(k=>/^https?:\/\//.test(ct[k]||'')).map(k=>`<a href="${esc(ct[k])}" target="_blank" rel="noopener" title="${SOC[k][0]}" style="background:${SOC[k][1]}"><svg viewBox="0 0 24 24" width="22" height="22" style="color:#fff">${SOC[k][2]}</svg></a>`).join('')}</div></div>
 <div class="mp"><svg viewBox="0 0 400 220" role="img" aria-label="Location map"><rect width="400" height="220" style="fill:var(--free)"/><path d="M0 150H400M0 70H400M120 0V220M290 0V220" style="stroke:var(--card);stroke-width:14;fill:none"/><path d="M0 200L400 20" style="stroke:var(--card);stroke-width:8;fill:none"/><rect x="20" y="85" width="80" height="50" rx="6" style="fill:var(--line)"/><rect x="140" y="85" width="60" height="50" rx="6" style="fill:var(--line)"/><rect x="310" y="90" width="60" height="45" rx="6" style="fill:var(--line)"/><path d="M205 118C190 98 186 90 186 80a19 19 0 0138 0c0 10-4 18-19 38z" fill="#e11d48"/><circle cx="205" cy="80" r="7" fill="#fff"/></svg>
 <a class="btn" href="${esc(mapUrl())}" target="_blank" rel="noopener">🗺 Open in Google Maps</a><a class="btn sec" href="${esc(mapUrl().replace('search/?api=1&query=','dir/?api=1&destination='))}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Get Directions</a></div></div>`}
function homeView(){
 const free=TOTAL-seatsUsed();
 const F=[['📚','Silent Study Hall','Distraction-free, disciplined environment for serious aspirants.'],['❄️','Comfortable Seating','Personal desk and chair with a fixed seat for every student.'],['💡','Power & Lighting','Proper lighting, charging points and fans/AC.'],['📶','Wi-Fi','Fast internet for online classes and mock tests.'],['💧','Drinking Water','Clean RO drinking water available all day.'],['📖','Newspapers & Magazines','Daily newspapers and competitive exam magazines.'],['📹','CCTV Security','24x7 CCTV surveillance for a safe study space.'],['🏆','Mock Test Support','Peer groups and a motivating environment for exam prep.']];
 const E=['UPSC','SSC','Banking','Railways','State PSC','Defence','Teaching','NEET / JEE','GATE'];
 $('#app').innerHTML=`<div class="hero"><h2>Welcome to Achievers <span>Study Point</span></h2><p>A calm, focused place for competitive exam aspirants. Reserve your own seat and make every study hour count.</p><div><button class="btn" data-g="reg">Register for a Seat</button><button class="btn ghost" data-g="login">Student Login</button><button class="btn ghost" data-g="admin">Admin Login</button></div></div>
 <div class="stats" style="margin-top:16px"><div class="stat"><small>Total seats</small><b>${TOTAL}</b></div><div class="stat"><small>Seats available now</small><b>${free}</b></div><div class="stat"><small>Students enrolled</small><b>${students.length}</b></div></div>
 <div class="card mgr">${mgr.photo?`<img src="${mgr.photo}" alt="Manager">`:'<div class="ph">👤</div>'}<div class="t"><h3>Manager’s Message</h3><p>${esc(mgr.msg)}</p><b>${esc(mgr.name)}</b><br><small>${esc(mgr.role)}</small></div></div>
 ${noticeHtml()}<div class="sec"><h3>Facilities</h3><div class="feat">${F.map(x=>`<div class="card"><div>${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>
 <h3>Exams our students prepare for</h3><div>${E.map(x=>`<span class="pill free" style="margin:3px;padding:6px 14px">${x}</span>`).join('')}</div>
 <h3>Timings &amp; Fees</h3><div class="feat"><div class="card"><b>🕕 Timings</b><small>Open daily, 6 AM to 10 PM. Morning, Evening and Full Day shifts</small></div><div class="card"><b>💰 Monthly fee</b><small>₹${ct.fee||600} per month</small></div><div class="card"><b>🪑 Seat allotment</b><small>Allotted by the admin after approving your registration</small></div></div>
 <h3>How it works</h3><div class="feat"><div class="card"><b>1. Register</b><small>Sign up with your email ID, mobile and exam.</small></div><div class="card"><b>2. Get approved</b><small>The admin approves your registration and allots a seat.</small></div><div class="card"><b>3. Login &amp; track</b><small>See your seat, attendance and fee status.</small></div></div>
 <h3>Contact</h3>${contactHtml()}</div>
 <div class="foot">© Achievers Study Point. All rights reserved.<br>Developed and managed by <b>Aman Ahmad</b> and <b>Meraj Alam</b></div>`;
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{tab=b.dataset.g;view='auth';render()});

const DEMO_OTP=true;
const last10=x=>String(x).replace(/\D/g,'').slice(-10);
const rnd6=()=>String(Math.floor(100000+Math.random()*900000));
function deliverOtp(ch,to,code){/* Real delivery needs a server: email via SendGrid or Nodemailer, WhatsApp via Meta Cloud API or Twilio. Call it here, e.g. POST /api/otp/send {channel:ch,to,code}. */}
function verifyOtp(email,phone,done){
 const m=$('#m'),ph=last10(phone);
 if(ph.length<10)return m.textContent='Enter a valid 10-digit WhatsApp mobile number.';
 if(students.some(s=>last10(s.phone)===ph)||wl.some(w=>last10(w.phone)===ph))return m.textContent='This mobile number is already registered.';
 m.textContent='';let ce,cw,exp,tries,last=0;
 const d=document.createElement('div');d.className='modal';
 d.innerHTML=`<div class="card" style="width:100%"><h3>Verify email and WhatsApp</h3><p class="hint" style="margin-top:0">A 6-digit OTP is sent to <b>${esc(email)}</b> and to WhatsApp <b>+91 ${ph}</b>. Enter both codes. They expire in 5 minutes.</p><div id="dm" class="hint" style="background:var(--free);color:var(--freet);padding:8px;border-radius:8px"></div><label>Email OTP</label><input id="oe" inputmode="numeric" maxlength="6"><label>WhatsApp OTP</label><input id="ow" inputmode="numeric" maxlength="6"><div class="msg" id="om"></div><button class="btn" id="ov">Verify &amp; Register</button> <button class="btn sec" id="orr" style="margin-top:14px">Resend OTP</button> <button class="btn sec" id="oc" style="margin-top:14px">Cancel</button></div>`;
 document.body.appendChild(d);const om=d.querySelector('#om'),dm=d.querySelector('#dm');
 const send=()=>{ce=rnd6();cw=rnd6();exp=Date.now()+3e5;tries=0;last=Date.now();deliverOtp('email',email,ce);deliverOtp('whatsapp',ph,cw);dm.style.display=DEMO_OTP?'':'none';dm.innerHTML='Demo mode: no email or WhatsApp service is connected yet, so the codes are shown here. Email OTP: <b>'+ce+'</b> | WhatsApp OTP: <b>'+cw+'</b>'};
 send();
 d.querySelector('#oc').onclick=()=>d.remove();
 d.querySelector('#orr').onclick=()=>{const w=30-Math.floor((Date.now()-last)/1000);om.style.color='var(--bad)';if(w>0)return om.textContent='Please wait '+w+' seconds to resend.';send();om.style.color='var(--ok)';om.textContent='New OTPs sent.'};
 d.querySelector('#ov').onclick=()=>{om.style.color='var(--bad)';if(Date.now()>exp)return om.textContent='OTP expired. Tap Resend OTP.';if(tries>=5)return om.textContent='Too many wrong attempts. Tap Resend OTP.';tries++;
  const a=d.querySelector('#oe').value.trim()===ce,b=d.querySelector('#ow').value.trim()===cw;
  if(!a||!b)return om.textContent=(!a&&!b?'Both OTPs are wrong.':!a?'Email OTP is wrong.':'WhatsApp OTP is wrong.')+' Attempts left: '+(5-tries);
  d.remove();done()}}
